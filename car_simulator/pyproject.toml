[project]
name = "car-simulator"
version = "0.1.0"
description = "Driving scenarios for CARLA 0.9.16, run with ScenarioRunner"
readme = "README.md"
# ScenarioRunner pins numpy==1.24.4, which has no Python 3.12 build
requires-python = ">=3.10,<3.12"
dependencies = [
    # From PyPI: the wheel shipped in CARLA_0.9.16/PythonAPI/carla/dist is cp312 only
    "carla==0.9.16",
    # ScenarioRunner's manual_control.py (manual ego driving)
    "pygame>=2.5",

    # ScenarioRunner v0.9.16, copied from external/scenario_runner/requirements.txt.
    # Keep in sync when changing the ScenarioRunner tag.
    "py-trees==0.8.3",
    "numpy==1.24.4",
    "networkx==3.4.2",
    "Shapely==2.1.1",
    "psutil",
    "xmlschema==1.0.18",
    "ephem",
    "tabulate",
    "opencv-python==4.7.0.72",
    "matplotlib",
    "six",
    "simple-watchdog-timer",
    "antlr4-python3-runtime==4.10",
    "graphviz",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carsim"]

[tool.uv]
# carla only publishes x86-64 Windows and Linux wheels
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
include = ["src", "apps", "tests", "scenarios"]
# Mirrors the PYTHONPATH that carsim.runner gives ScenarioRunner, plus apps/ (imported by tests)
extraPaths = ["src", "apps", "CARLA_0.9.16/PythonAPI/carla", "external/scenario_runner"]
